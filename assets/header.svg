<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="80%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0F2027" />
    </linearGradient>

    <!-- Wave Cyber Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2C5364" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#203A43" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F2027" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="220" rx="12" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines (Subtle) -->
  <path d="M 0 40 L 850 40 M 0 80 L 850 80 M 0 120 L 850 120 M 0 160 L 850 160" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1" />
  <path d="M 100 0 L 100 220 M 250 0 L 250 220 M 425 0 L 425 220 M 600 0 L 600 220 M 750 0 L 750 220" stroke="#00F0FF" stroke-opacity="0.04" stroke-width="1" />

  <!-- Bottom Wave Layers -->
  <path d="M 0 185 Q 212.5 145 425 185 T 850 185 L 850 220 L 0 220 Z" fill="url(#waveGrad2)" />
  <path d="M 0 195 Q 212.5 165 425 195 T 850 195 L 850 220 L 0 220 Z" fill="url(#waveGrad)" />

  <!-- Neon Border Top Accent -->
  <rect x="0" y="0" width="850" height="3" fill="#00F0FF" opacity="0.8" filter="url(#neonGlow)" />

  <!-- Header Title -->
  <text x="50%" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="6" fill="#00F0FF" filter="url(#neonGlow)">
    YASHI SINGHAL
  </text>

  <!-- Subtitle -->
  <text x="50%" y="125" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="3" fill="#8892B0">
    CLOUD NATIVE &amp; JAVA &amp; OPEN SOURCE CONTRIBUTOR
  </text>

  <!-- Status Chip -->
  <g transform="translate(365, 142)">
    <rect width="120" height="22" rx="11" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="15" cy="11" r="4" fill="#00F0FF" />
    <text x="26" y="15" font-family="'Segoe UI', monospace" font-size="11" font-weight="bold" fill="#00F0FF">YS-01 // ACTIVE</text>
  </g>
</svg>
